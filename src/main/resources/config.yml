# ==========================================
# LOCOPILLARS - PILLARS OF FORTUNE CONFIG
# ==========================================

# ==========================================
# BUILD INFORMATION
# ==========================================
build:
  # Which Modrinth update channel you want to follow.
  # RELEASE = only stable releases | BETA = beta + release | ALPHA = all three
  # Change this freely — it controls which updates you get notified about.
  type: RELEASE
  # version & date are locked — overwritten on every startup from the JAR.
  version: ""
  date: ""

# ==========================================
# UPDATE CHECKER (Modrinth)
# ==========================================
update-checker:
  # Check Modrinth for new releases on startup
  enabled: true
  # Notify players with 'locopillars.notify.update' permission on join
  notify-on-join: true

# Enable debug logging - shows detailed information about plugin operations
# Set to false for production to improve performance
debug: false

# Game instance configuration
game:
  # Number of arena instances to pre-create per map type.
  # All schematic variants are pre-loaded into a shared clipboard cache at startup,
  # so the clipboard memory cost is fixed at (unique .schem files) regardless of this number.
  # The main cost per instance is the arena world chunk data kept in RAM.
  instances-per-type: 10
  # Distance between arena instances in blocks
  # Should be larger than your biggest arena
  instance-distance: 1000

# Auto-queue: after a game ends, players are sent directly into a fresh game
# of the same type after a short countdown.  When disabled here, the feature is
# fully off regardless of a player's personal /pillars autoqueue setting.
auto-queue:
  enabled: true

# Spawn configuration (matches ConfigManager exactly)
Spawn:
  World: "world"         # Name of your main lobby world
  X: 0.5                 # X coordinate for lobby spawn
  Y: 68.0                # Y coordinate for lobby spawn
  Z: 0.5                 # Z coordinate for lobby spawn

# Database configuration
database:
  # Supported types: mysql, mariadb, postgresql, h2
  type: "h2"
  host: "localhost"        # For network databases only (mysql, mariadb, postgresql)
  port: 3306               # For network databases only
  database: "locopillars"
  username: ""             # For network databases only
  password: ""             # For network databases only
  useSSL: false

  # Connection pool settings
  max-pool-size: 10
  min-pool-size: 5
  connection-timeout-ms: 30000
  idle-timeout-ms: 600000
  max-lifetime-ms: 1800000
  leak-detection-threshold-ms: 60000

  # Maintenance settings
  cleanup-enabled: true
  cleanup-days: 30

  # Performance settings
  enable-query-logging: false
  slow-query-threshold-ms: 1000

  # Cache settings
  cache-size: 1000
  cache-expiration-minutes: 30

# WorldEdit / FAWE provider settings
worldedit:
  # Which WorldEdit implementation to use for schematic operations.
  # Options: AUTO (use FAWE if installed, otherwise WorldEdit), WORLDEDIT, FAWE
  provider: AUTO

# Performance related settings
performance:
  # Maximum number of schematics that can be pasted simultaneously
  # Lower values = slower startup but less server lag during initialization
  max-concurrent-schem-pastes: 5
  # Timeout in milliseconds for schematic pasting operations
  schem-paste-timeout: 30000

# User interface settings
ui:
  # Show progress bar during arena generation instead of detailed logs
  enable-progress-bar: true

# World management settings
world:
  # Automatically save arena worlds periodically
  auto-save: true
  # Auto-save interval in ticks (20 ticks = 1 second)
  auto-save-interval: 6000

# ==========================================
# CHAT SYSTEM CONFIGURATION
# ==========================================

chat:
  # === GENERAL CHAT SETTINGS ===
  enabled: true
  cooldown-seconds: 3
  max-length: 256

  # === CHAT TYPES ===
  lobby-chat:
    enabled: true

  game-chat:
    enabled: true

  spectator-chat:
    enabled: true

  team-chat:
    enabled: true

  # === SOCIAL SPY ===
  social-spy:
    enabled: true

  # === LOGGING ===
  logging:
    enabled: true

  # === PROFANITY FILTER ===
  profanity-filter:
    enabled: false
    words:
      - "word1"
      - "word2"
      - "word3"

  # === CHAT FORMATS ===
  # Available placeholders:
  # {player} - Player name
  # {displayname} - Player display name
  # {message} - The message content
  # {team} - Team name (if applicable)
  # {type} - Chat type
  # {world} - World name
  # Color codes: &a, &b, &c, etc.

  formats:
    # Lobby chat format
    lobby: "&7[&bLobby&7] &f{player}&7: &f{message}"

    # Game lobby (waiting for game to start)
    game-lobby: "&7[&eGame&7] &f{player}&7: &f{message}"

    # Spectator chat
    spectator: "&7[&8Spectator&7] &f{player}&7: &8{message}"

    # Team chat during games
    team: "&7[&a{team}&7] &f{player}&7: &a{message}"

    # Global game chat
    global: "&7[&cGlobal&7] &f{player}&7: &f{message}"

    # Social spy format (what staff see)
    social-spy: "&8[SocialSpy] &7{type} &8» &f{player}&7: &f{message}"

    # Join/leave messages
    join: "&a{player} &7joined the lobby"
    leave: "&c{player} &7left the lobby"
    game-join: "&a{player} &7joined the game"
    game-leave: "&c{player} &7left the game"

Tab:
  Enabled: true

  Header:
    - "&aLocopillars"
    - "&7Welcome to the server!"
    - "&eGame: %game_name%"
  Footer:
    - "&7Online: %online_players%"
    - "&eHave fun!"

  Sorting-Groups:
    Order: Owner,Admin,Mod,Helper,Vip,Default
    # Koppel elke groep aan de EXACTE permissie die de plugin moet checken.
    # De speler met de permissie van een hogere groep (eerder in Order) komt hoger.
    # Je mag hier ELKE permissie-node zetten — precies die node wordt gecheckt.
    # Voorbeeld: zet je "Owner: kindjes.group.50", dan moet de speler exact
    # "kindjes.group.50" hebben om als Owner gesorteerd te worden.
    Permissions:
      Owner: tab.order.owner
      Admin: tab.order.admin
      Mod: tab.order.mod
      Helper: tab.order.helper
      Vip: tab.order.vip
      Default: tab.order.default

  Display-Mode: "AUTO"  # AUTO, ALL, GAME, LOBBY

  display-online-player-list-per-gameinstance: true

  Player-Prefix-Suffix:
    AUTO:
      Prefix: "&f%luckperms_prefix%"
      Suffix: "&f"
    ALL:
      Prefix: "&f%luckperms_prefix%"
      Suffix: "&f"
    GAME:
      Prefix: "&f%luckperms_prefix%"
      Suffix: "&f"
    LOBBY:
      Prefix: "&f%luckperms_prefix%"
      Suffix: "&f"

  # Supported placeholders:
  # %team%, %player_name%, %kills%, %group%, %game_name%, etc.


# LocoPillars Scoreboards Configuration
# This config controls the sidebar scoreboards shown to players

Scoreboards:
  GlobalEnabled: true

  Lobby:
    Enabled: true
    Title: "&#FF7300&lLocoMc"
    Lines:
      13: "&f"
      12: "&b✦ &fWelcome to &6Pillars&f %locopillars_player_name%!"
      11: "&f   &fOnline players: &a%server_online%"
      10: "&f"
      9: "&fRank: &f%luckperms_prefix%"
      8: "&fCoins: &6%playerpoints_points%"
      7: "&f"
      6: "&fLevel: &b%locopillars_db_level%"
      5: "&fExperience: &e%locopillars_db_experience%"
      4: "&fAchievements: &a%locopillars_achievement_total_completed_percent%% completed"
      2: "&f"
      1: "&fPlay.LocoMc.net"

  GameLobby:
    Enabled: true
    Title: "&#FF7300&lLocoMc"
    Lines:
      9: "&f"
      8: "埆 &eWaiting for game to start..."
      7: "&f"
