  Cage:
    Enabled: true
    Title: "&#FF7300&lLocoMc"
    Lines:
      9: "&f"
      8: "埆 &eGame starts in: &e%locopillars_game_lobby_timer%"
      7: "&f"
      6: "&fGame: &b%locopillars_game_name%"
      5: "&fPlayers: &a%locopillars_game_players_in_game% &7/ &c%locopillars_game_players_max%"
      4: "&fMap: &e%locopillars_game_map_name%"
