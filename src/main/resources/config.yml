      if3: "TEAM_AMOUNT >= 3 LINE=%locopillars_game_team_team3_displayname%: %locopillars_game_team_team3_status_symbol% &7(&a%locopillars_game_team_team3_players_alive%&7/&f%locopillars_game_team_team3_players_total%&7)"
