Settings:
  BuildHeight: 60
  BuildRange: 40
  DeathHeight: -10
  LobbyTimer: 10
  CageTimer: 5
  GameTimer: 900
  ItemTimer: 5
  Can-Break-Map-Blocks: false
  Can-BlowUp-Map-Blocks: false
  # Origin-relative "x,y,z" map blocks that stay breakable even when Can-Break-Map-Blocks is false.
  # Manage these in-game with the Breakable Selector (editor hotbar slot 7).
  Breakable-Blocks: []
  LobbyEnabled: true
  SpawnPoint:
    X: 0
    Y: 60
    Z: 0
  Spawn-Area:
    Loc1:
      X: -10
      Y: 64
      Z: 10
    Loc2:
      X: 10
      Y: 59
      Z: -10
  DisplayName: '&aGarden Squad''s'
  RandomItems:
    Type: Blacklisted
  LoadMap: true
Events:
  Border:
    Enabled: false
    Close-Border-Timer: 30
  Voting:
    Double-HP:
      Enabled: true
    Floor-Is-Lava:
      Enabled: true
    Inventory-Swap:
      Enabled: true
    Player-Swap:
      Enabled: true
    Elytra-Mode:
      Enabled: true
    No-Fall-Mode:
      Enabled: true
    1-Heart-Mode:
      Enabled: true
Rewards:
  OnStartGameRewards:
    enabled: true
    messages:
      - ' '
      - '      &6&lMacMC Pillars'
      - ' '
      - '&7Teaming is &cnot &7allowed!'
      - '&7Have fun! May the best player win.'
      - ' '
      - '      &6Play.MacMC.net'
      - ' '
    commands: []
  OnKillRewards:
    enabled: true
    killed_by_player:
      killer:
        messages:
          - '&#7FFC5D&l[PILLARS] &aExcellent work, &f%killer%&f! You have defeated &c%death%&f!'
        commands:
          - 'mpa givexp %player% 4'
      killed_player:
        messages:
          - '&#7FFC5D&l[PILLARS] &c%death%, &fyou have been eliminated by &c%killer%&f. &aBetter luck next time!'
        commands: []
      remaining_players:
        messages:
          - '&#7FFC5D&l[PILLARS] &cA competitor has fallen! %killer% eliminated %death%.'
        commands: []
  OnLeaveRewards:
    enabled: true
    left_player:
      messages:
        - '&#7FFC5D&l[PILLARS] &fFarewell %player%, you have left the battle!'
      commands: []
    remaining_players:
      messages:
        - '&#7FFC5D&l[PILLARS] &a%leftplayer%&c has left!'
      commands: []
  OnEndGameRewards:
    enabled: true
    winners:
      messages:
        - '&#7FFC5D&l[PILLARS] &aCongratulations %player%, you are victorious!'
        - '&#7FFC5D&l[PILLARS] &a%winnerteamname% won the game!'
      commands:
        - 'mpa givexp %player% 7'
    spectators:
      messages:
        - '&#7FFC5D&l[PILLARS] &fThe match is over, &c%player%.'
      commands: []
