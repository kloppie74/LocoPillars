Rewards:
  OnStartGameRewards:
    Enabled: true
    Rewards:
    - '[MESSAGE:PLAYER] '
    - "[MESSAGE:PLAYER] \t\t&6&lMacMC Pillars"
    - '[MESSAGE:PLAYER] '
    - '[MESSAGE:PLAYER] &7Teaming is &cnot &7allowed!'
    - '[MESSAGE:PLAYER] &7Have fun! May the best player win.'
    - '[MESSAGE:PLAYER] '
    - "[MESSAGE:PLAYER] \t\t&6Play.MacMC.net"
    - '[MESSAGE:PLAYER] '
  OnKillRewards:
    Enabled: true
    Rewards:
      Killed-By-Player:
        Enabled: true
        Rewards:
          Killed-Player:
            Enabled: true
            Rewards:
            - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &c${death}, &fyou have been eliminated
              by &c${killer}&f. &aBetter luck next time!'
          Killer:
            Enabled: true
            Rewards:
            - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &aExcellent work, &f${killer}!&f
              You have defeated &c${death}&f!'
            - '[COMMAND:CONSOLE] mpa givexp ${player} 4'
          Remaining-Players:
            Enabled: true
            Rewards:
            - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &cA competitor has fallen! ${killer}
              eliminated ${death}.'
      Not-Killed-By-Player:
        Enabled: true
        Rewards:
          Killed-Player:
            Enabled: true
            Rewards:
            - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &c${death}, &fyou have been eliminated!
              &aBetter luck next time!'
            - '[COMMAND:CONSOLE] mpa givexp ${player} 3'
          Remaining-Players:
            Enabled: true
            Rewards:
            - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &cA competitor has fallen! ${death}
              eliminated ${death}.'
  OnLeaveRewards:
    Enabled: true
    Rewards:
      left-Player:
        Enabled: true
        Rewards:
        - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &fFarewell ${player}, you have left
          the battle!'
      Remaining-Players:
        Enabled: true
        Rewards:
        - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &a${leftplayer}&c has left!'
  OnEndGameRewards:
    Enabled: true
    Rewards:
      Spectators:
        Enabled: true
        Rewards:
        - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &fThe match is over, &c${player}.'
      Winners:
        Enabled: true
        Rewards:
        - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &aCongratulations ${player}, you are
          victorious!'
        - '[MESSAGE:PLAYER] #7FFC5D&l[PILLARS] &a${winnerteamname}won the game!'
        - '[COMMAND:CONSOLE] mpa givexp ${player} 7'
