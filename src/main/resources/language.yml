    enabled_self: "&aYou are now hidden from other players."
    enabled_other: "&aYou have hidden &6{target} &afrom other players."
    disabled_self: "&cYou are now visible to other players again."
    disabled_other: "&6{target} &cis now visible to other players again."

  # /hideothers
  hideothers:
    no_permission: "&cYou do not have permission to toggle hideOthers for other players."
    enabled_self: "&aYou are now hiding other players in this world."
    enabled_other: "&aYou have enabled hideOthers for &6{target}."
