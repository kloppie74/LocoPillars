# ============================================================
#  LocoPillars — language.yml
#
#  Alle berichten die in de Minecraft-chat verschijnen voor
#  spelers staan hier. Console-/debug-berichten staan NIET
#  in dit bestand en zijn hardcoded.
#
#  Kleurcodes: gebruik & voor kleurcodes (&a, &c, &e, ...)
#  Placeholders: {player}, {game}, {count}, {name}, enz.
# ============================================================

# ─────────────────────────────────────────────────────────────
# ALGEMEEN
# ─────────────────────────────────────────────────────────────
general:
  player_only: "&cThis command can only be used by players!"
  no_permission: "&cYou do not have permission to use this command!"
  unknown_subcommand: "&cUnknown subcommand: &f{input}"
  player_not_found: "&cPlayer not found or not online."
  database_error: "&cDatabase error occurred. Please try again."
  feature_unavailable: "&cThis feature is not available right now."

# ─────────────────────────────────────────────────────────────
# SPELER JOIN (fout bij inloggen)
# ─────────────────────────────────────────────────────────────
player_join:
  setup_error: "&c[LocoPillars] An error occurred while setting up your profile."
  setup_error_contact: "&c[LocoPillars] Please contact an administrator if this persists."

# ─────────────────────────────────────────────────────────────
# /pillars COMMAND
# ─────────────────────────────────────────────────────────────
pillars:
  no_permission_sub: "&cYou don't have permission to use /pillars {sub}!"

  # join
  join:
    usage: "&cUsage: /pillars join <gametype>"
    available_types_header: "&eAvailable game types:"
    available_type_entry: "&7- {name} ({display})"
    random_hint: "&7Or use &b/pillars join random &7to join any available game"
    already_in_game: "&cYou are already in a game! Use &e/pillars leave &cto leave your current game."
    no_games_available: "&cNo available games to join right now!"
    no_suitable_game: "&cNo suitable game found!"
    failed_game_full: "&cFailed to join game. Game may be full."
    failed_no_instance: "&cFailed to join game. No available instances or game is full."
    type_not_found: "&cGame type '&f{type}&c' not found!"
    random_joined: "&aYou have joined a random game: &e{game}"
    joined: "&aSuccessfully joined &e{game}&a!"
    players_count: "&ePlayers: &b{current}&7/&b{max}"
    starting_soon: "&aGame will start soon!"
    waiting_for_players: "&eWaiting for &c{needed} &emore player(s) to start..."

  # leave
  leave:
    not_in_game: "&cYou are not in a game!"

  # list
  list:
    header: "&6=== Available Game Types ==="
    no_types: "&cNo game types available!"
    type_entry: "&e{name} &7({display})"
    type_stats: "&7  Available: &b{available} &7| Active: &b{active}"
    type_player_info: "&7  Players: &b{min}-{max} &7| Teams: &b{teams}"
    join_hint: "&7Use &e/pillars join <gametype> &7to join a game!"
    random_hint: "&7Or use &b/pillars join random &7to join any available game"

  # status
  status:
    not_in_game: "&eYou are not currently in a game."
    not_in_game_hint: "&7Use &e/pillars list &7to see available games!"
    header: "&6=== Game Status ==="
    game: "&eGame: &b{game}"
    state: "&eState: &b{state}"
    players: "&ePlayers: &b{current}&7/&b{max}"
    world: "&eWorld: &b{world}"
    instance_id: "&eInstance ID: &b{id}"
    waiting_for_players: "&7Waiting for &c{needed} &7more player(s) to start..."
    ready_to_start: "&aReady to start!"
    starting: "&aGame is starting..."
    active: "&cGame is active! Fight!"
    ended: "&eGame has ended."
    resetting: "&7Game is resetting..."

  # stats
  stats:
    header: "&6=== Server Statistics ==="
    total_instances: "&eTotal Instances: &b{count}"
    available_instances: "&eAvailable Instances: &b{count}"
    active_games: "&eActive Games: &b{count}"
    arena_worlds: "&eArena Worlds: &b{count}"
    game_types: "&eGame Types: &b{count}"
    type_summary: "&7{name}: &b{available} &7available, &b{active} &7active, &b{players} &7players"

  # help
  vote:
    not_in_game: "&cYou must be in a game lobby to vote!"
    voting_closed: "&cVoting is only available before the game starts!"

  autoqueue:
    start: "&aAuto-queue: &7Rejoining &e{type} &7in 3 seconds. &8(/pillars leave to cancel)"
    cancelled: "&eAuto-queue cancelled."
    no_game: "&eAuto-queue: &7No available &e{type} &7games right now. Returning to lobby."
    toggled_on: "&aAuto-queue is now &lON&r&a — you will be sent to a new game after each match."
    toggled_off: "&eAuto-queue is now &lOFF&r&e — you will return to the lobby after each match."
    disabled_server: "&cAuto-queue is disabled on this server."

  help:
    header: "&6=== Pillars of Fortune Commands ==="
    join: "&e/pillars join <gametype> &7- Join a game"
    join_random: "&e/pillars join random &7- Join any available game"
    leave: "&e/pillars leave &7- Leave your current game"
    list: "&e/pillars list &7- List available game types"
    status: "&e/pillars status &7- Show your current game status"
    server_stats: "&e/pillars stats &7- Show server statistics"
    vote: "&e/pillars vote &7- Vote for a special game event"
    autoqueue: "&e/pillars autoqueue &7- Toggle automatic rejoin after each game"
    help: "&e/pillars help &7- Show this help message"

# ─────────────────────────────────────────────────────────────
# GAME — JOIN / LEAVE BROADCASTS
# ─────────────────────────────────────────────────────────────
game:
  join:
    broadcast: "&a{player} joined the game! ({current}/{max})"
    welcome: "&aYou joined {game}!"
    error_db: "&cDatabase error occurred. Please try again."
    error_no_game: "&cNo available games found for type: {type}"
    error_full: "&cThis game is full!"
    error_teleport: "&cError: Failed to teleport to game area"
    error_spawn_null: "&cError: Invalid spawn location (world is null)"
    error_spawn_mismatch: "&cError: Spawn location world mismatch"
    error_spawn_boundary: "&cError: Spawn area outside game boundaries!"
    error_no_team_slots: "&cNo team slots available in this game right now!"

  leave:
    broadcast: "&e{player} left the game! ({current}/{max})"
    success: "&aYou left the game!"
    cancelled_start: "&cNot enough players! Game start cancelled."

  # Countdown (lobby)
  countdown:
    cancelled: "&cNot enough players! Countdown cancelled."
    starting_in: "&aGame starting in {seconds} seconds!"
    title_starting: "&aGame starting in:"
    title_countdown: "&f{seconds}"

  # Cage countdown
  cage:
    opening_in: "&aCages open in {seconds} seconds!"
    opened: "&aGates opened! The battle begins!"
    go_title: "&aGO!"

  # Start / end
  start:
    started: "&aGame started! Fight for victory!"

  end:
    game_over: "&6=== GAME OVER ==="
    reason: "&e{reason}"
    time_up: "Time's up! Game ended in a draw!"
    no_players: "No players remaining!"
    winner_elimination: "{winner} wins by elimination!"
    winner_team: "{team} wins!"
    game_ended: "Game ended"

  # Timer broadcasts (chat)
  timer:
    ending_in: "&e⏰ Game ending in: {time}"

  # Team assignment
  team:
    assigned: "&aYou are on team: {team}"

  # Player eliminated
  elimination:
    broadcast: "&c{player} has been eliminated!"
    self: "&cYou have been eliminated! Better luck next time!"

# ─────────────────────────────────────────────────────────────
# GAME — ACTION BAR (in-game timer boven hotbar)
# ─────────────────────────────────────────────────────────────
actionbar:
  waiting: "&e⏳ Waiting for {needed} more player(s)"
  starting: "&a🚀 Game starting soon..."
  active_timer: "&c⏰ Game: {time}"
  active_timer_fallback: "&c⏰ Game: Active"
  active_separator: "&8 | "
  active_items: "&6🎁 Items: {seconds}s"
  active_players: "&b👥 Players: {count}"
  ended: "&6🏆 Game Ended!"
  resetting: "&7🔄 Resetting..."

# ─────────────────────────────────────────────────────────────
# GAME — GAMEPLAY REGELS (blocks, pvp, grenzen)
# ─────────────────────────────────────────────────────────────
gameplay:
  pvp_not_allowed: "&cPvP is not allowed yet!"
  void_fell: "&cYou fell into the void!"
  block_break_not_active: "&cYou cannot break blocks while the game is not active!"
  block_break_cage: "&cYou cannot break cage blocks until the game starts!"
  block_break_out_of_bounds: "&cYou cannot break blocks outside the game area!"
  block_break_player_placed_only: "&cYou can only break blocks that you placed!"
