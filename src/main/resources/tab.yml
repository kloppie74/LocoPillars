Tab:
  Enabled: true

  Header:
    - "&aLocopillars"
    - "&7Welcome to the server!"
    - "&eGame: %game_name%"
  Footer:
    - "&7Online: %online_players%"
    - "&eHave fun!"

  Sorting-Groups:
    Order: Owner,Admin,Mod,Helper,Vip,Default
    Permissions:
      Owner: tab.order.owner
      Admin: tab.order.admin
      Mod: tab.order.mod
      Helper: tab.order.helper
      Vip: tab.order.vip
      Default: tab.order.default

  Display-Mode: "AUTO"  # AUTO, ALL, GAME, LOBBY

  display-online-player-list-per-gameinstance: true

  Player-Prefix-Suffix:
    AUTO:
      Prefix: "%luckperms_prefix%"
      Suffix: "&f"
    ALL:
      Prefix: "%luckperms_prefix%"
      Suffix: "&f"
    GAME:
      Prefix: "%luckperms_prefix%"
      Suffix: "&f"
    LOBBY:
      Prefix: "%luckperms_prefix%"
      Suffix: "&f"

  # Supported placeholders:
  # %team%, %player_name%, %kills%, %group%, %game_name%, etc.