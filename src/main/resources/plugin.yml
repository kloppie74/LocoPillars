name: LocoPillars
main: org.Kloppie74.locoPillars.LocoPillars
version: ${version}
api-version: 1.21
authors: [kloppie74]
description: "Pillars of the Fortune - The Best plugin to play pillars of the fortune!"
depend: [WorldEdit, PlaceholderAPI]

commands:
  pillars:
    description: "Main command for Pillars of Fortune"
    usage: "/pillars <join|leave|list|status|stats|vote|autoqueue|help> [args]"
    aliases: [pillar, pof, pillarsoffortune, games]
  memory:
    description: "Memory management commands"
    usage: "/memory <check|clear|status>"
    aliases: [mem, memcheck]
    permission: locopillars.memory.use
    permission-message: "§cYou don't have permission to use /memory!"
  vanish:
    description: Toggle vanish mode for yourself or others
    usage: /vanish [player]
    permission: locopillars.vanish
    aliases: [ v ]
  hideme:
    description: Hide yourself from other players or toggle for others
    usage: /hideme [player]
    permission: locopillars.hideme
    aliases: [ hm ]
  hideothers:
    description: Hide other players from your view or toggle for others
    usage: /hideothers [player]
    permission: locopillars.hideothers
    aliases: [ ho ]
  showothers:
    description: Show specific players when hideothers is enabled
    usage: /showothers <player>
    permission: locopillars.showothers
    aliases: [ so ]
  profile:
    description: View your global stats profile
    usage: /profile
    permission: locopillars.profile
    aliases: [myprofile, prof]
  stats:
    description: View your game statistics
    usage: /stats [achievements|leaderboards|history]
    permission: locopillars.stats
    aliases: [statistics, mystats]
  achievements:
    description: Achievement system commands
    usage: /achievements <subcommand>
    aliases: [ ach, achievement ]
    permission: locopillars.achievements.use
    permission-message: "§cYou don't have permission to use this command!"
  tab:
    description: "Reload the TAB config"
    usage: "/tab reload"
    permission: locopillars.admin
    permission-message: "§cYou do not have permission!"

  # === CHAT SYSTEM COMMANDS ===
  chatadmin:
    description: "Chat administration commands"
    usage: "/chatadmin <reload|stats|announce|mute|unmute|clear|spy|toggle|cooldown|help> [args]"
    permission: locopillars.chat.admin
    aliases: [ca, chatmanager]
    permission-message: "§cYou don't have permission to use chat admin commands!"

  socialspy:
    description: "Toggle social spy to see all chat messages"
    usage: "/socialspy"
    permission: locopillars.chat.socialspy
    aliases: [spy, ss]
    permission-message: "§cYou don't have permission to use social spy!"

  teamchat:
    description: "Toggle team chat mode during games"
    usage: "/teamchat"
    permission: locopillars.chat.teamchat
    aliases: [tc, team]
    permission-message: "§cYou don't have permission to use team chat!"
  luckyblocks:
    description: "Show the LuckyBlocks menu or get a LuckyBlock"
    usage: "/luckyblocks [menu|getluckyblock]"
    aliases: [ luckyblock, luckyb ]

  spawn:
    description: "Teleport to the lobby spawn (or teleport another player there)"
    usage: "/spawn [player]"
    permission: locopillars.spawn
    aliases: [ hub, lobby ]

  setspawn:
    description: "Set the lobby spawn to your current location"
    usage: "/setspawn"
    permission: locopillars.setspawn
    permission-message: "§cYou don't have permission to set the spawn!"

  editor:
    description: "Admin Editor System – toggle edit mode and manage maps"
    usage: "/editor <toggle|map|info|doctor|hotbar|holograms|setup|create|edit|delete|list|save|cancel|resize|settings|validate|files|spawn|help> [args]"
    permission: locopillars.admin
    permission-message: "§cYou do not have permission to use the editor!"
    aliases: [ adminedit, admineditor ]

  cosmetics:
    description: "Browse, buy and equip cosmetics (Kill/Win/Death effects & Custom Cages)"
    usage: "/cosmetics [shop|select|give|coins|reload] [args]"
    aliases: [ cosm, cosmetic ]

  # === PILLARS ADMIN ===
  pillarsadmin:
    description: "Administrative commands for managing player coins, XP and levels"
    usage: "/pillarsadmin <addcoins|removecoins|setcoins|addxp|setxp|setlevel|stats|help> [player] [amount]"
    permission: locopillars.admin
    permission-message: "§cYou don't have permission to use PillarsAdmin commands!"
    aliases: [ padmin, pa ]

  # === PARTY SYSTEM ===
  party:
    description: "Party system – invite friends and join games together"
    usage: "/party <invite|accept|deny|leave|kick|disband|transfer|info|chat|warp|help> [args]"
    permission: locopillars.party.use
    permission-message: "§cYou don't have permission to use party commands!"
    aliases: [ p ]

  # === CHAT TOGGLE ===
  chat:
    description: "Switch or toggle your active chat channel"
    usage: "/chat [party|global|team]"
    permission: locopillars.chat.use
    aliases: [ ch ]


permissions:
  locopillars.luckyblocks.menu:
    description: "Open the LuckyBlocks menu"
    default: true
  locopillars.luckyblocks.getluckyblock:
    description: "Get a LuckyBlock with /luckyblocks getluckyblock"
    default: op
  locopillars.pillars.join:
    description: "Use /pillars join"
    default: true
  locopillars.pillars.leave:
    description: "Use /pillars leave"
    default: true
  locopillars.pillars.list:
    description: "Use /pillars list"
    default: true
  locopillars.pillars.status:
    description: "Use /pillars status"
    default: true
  locopillars.pillars.stats:
    description: "Use /pillars stats"
    default: true
  locopillars.pillars.help:
    description: "Use /pillars help"
    default: true
  locopillars.pillars.vote:
    description: "Use /pillars vote to open the event voting GUI"
    default: true
  locopillars.pillars.autoqueue:
    description: "Use /pillars autoqueue to toggle the personal auto-queue setting"
    default: true

  locopillars.memory.use:
    description: "Use /memory command"
    default: op

  # === SPAWN PERMISSIONS ===
  locopillars.spawn:
    description: "Use /spawn to teleport to the lobby spawn"
    default: true

  locopillars.spawn.others:
    description: "Teleport other players to spawn with /spawn <player>"
    default: op

  locopillars.setspawn:
    description: "Set the lobby spawn location with /setspawn"
    default: op

  locoPillars.play:
    description: "Allow players to join and play games"
    default: true
  locopillars.admin:
    description: "Administrative permissions for LocoPillars"
    default: op

  locopillars.editor:
    description: "Use the /editor command and related admin-editor tools"
    default: op
  locoPillars.stats:
    description: "View server statistics"
    default: true

  locopillars.profile:
    description: "Use /profile to view your stats"
    default: true

  # === CHAT SYSTEM PERMISSIONS ===
  locopillars.chat.*:
    description: "All chat permissions"
    default: op
    children:
      locopillars.chat.admin: true
      locopillars.chat.socialspy: true
      locopillars.chat.bypass-cooldown: true
      locopillars.chat.bypass-filter: true
      locopillars.chat.stats: true

  locopillars.chat.use:
    description: "Basic chat usage permission"
    default: true

  locopillars.chat.admin:
    description: "Chat administration permissions"
    default: op
    children:
      locopillars.chat.admin.reload: true
      locopillars.chat.admin.stats: true
      locopillars.chat.admin.announce: true
      locopillars.chat.admin.mute: true
      locopillars.chat.admin.unmute: true
      locopillars.chat.admin.clear: true
      locopillars.chat.admin.toggle: true
      locopillars.chat.admin.cooldown: true

  locopillars.chat.admin.reload:
    description: "Reload chat configuration"
    default: op

  locopillars.chat.admin.stats:
    description: "View detailed chat statistics"
    default: op

  locopillars.chat.admin.announce:
    description: "Send announcements to players"
    default: op

  locopillars.chat.admin.mute:
    description: "Mute players from chat"
    default: op

  locopillars.chat.admin.unmute:
    description: "Unmute players from chat"
    default: op

  locopillars.chat.admin.clear:
    description: "Clear chat for players"
    default: op

  locopillars.chat.admin.toggle:
    description: "Toggle chat features"
    default: op

  locopillars.chat.admin.cooldown:
    description: "Manage player chat cooldowns"
    default: op

  locopillars.chat.socialspy:
    description: "Use social spy to see all chat messages"
    default: op

  locopillars.chat.teamchat:
    description: "Use team chat during games"
    default: true

  locopillars.chat.bypass-cooldown:
    description: "Bypass chat cooldown restrictions"
    default: op

  locopillars.chat.bypass-filter:
    description: "Bypass profanity and other chat filters"
    default: op

  locopillars.chat.stats:
    description: "View basic chat statistics"
    default: op

  # === VANISH PERMISSIONS ===
  locopillars.vanish:
    description: "Use vanish commands"
    default: op

  locopillars.hideme:
    description: "Use hideme command"
    default: true

  locopillars.hideothers:
    description: "Use hideothers command"
    default: true

  locopillars.showothers:
    description: "Use showothers command"
    default: true

  # === ACHIEVEMENT PERMISSIONS ===
  locopillars.achievements.*:
    description: "All achievement permissions"
    default: op
    children:
      locopillars.achievements.use: true
      locopillars.achievements.admin: true

  locopillars.achievements.use:
    description: "Use basic achievement commands"
    default: true

  locopillars.achievements.admin:
    description: "Administer achievements"
    default: op

  # === PARTY PERMISSIONS ===
  locopillars.party.*:
    description: "All party permissions"
    default: op
    children:
      locopillars.party.use: true
      locopillars.party.limit.16: true

  locopillars.party.use:
    description: "Use the /party command"
    default: true

  # Party size limits — higher numbers override lower ones.
  # Every player should have at least locopillars.party.limit.8.
  locopillars.party.limit.1:
    description: "Max party size: 1 (effectively no party)"
    default: false
  locopillars.party.limit.2:
    description: "Max party size: 2"
    default: false
  locopillars.party.limit.3:
    description: "Max party size: 3"
    default: false
  locopillars.party.limit.4:
    description: "Max party size: 4"
    default: false
  locopillars.party.limit.5:
    description: "Max party size: 5"
    default: false
  locopillars.party.limit.6:
    description: "Max party size: 6"
    default: false
  locopillars.party.limit.7:
    description: "Max party size: 7"
    default: false
  locopillars.party.limit.8:
    description: "Max party size: 8 (default for all players)"
    default: true
  locopillars.party.limit.9:
    description: "Max party size: 9"
    default: false
  locopillars.party.limit.10:
    description: "Max party size: 10"
    default: false
  locopillars.party.limit.11:
    description: "Max party size: 11"
    default: false
  locopillars.party.limit.12:
    description: "Max party size: 12"
    default: false
  locopillars.party.limit.13:
    description: "Max party size: 13"
    default: false
  locopillars.party.limit.14:
    description: "Max party size: 14"
    default: false
  locopillars.party.limit.15:
    description: "Max party size: 15"
    default: false
  locopillars.party.limit.16:
    description: "Max party size: 16 (hard cap)"
    default: false

  # === UPDATE CHECKER PERMISSIONS ===
  locopillars.notify.update:
    description: "Receive an in-game notification when a newer LocoPillars version is available on Modrinth"
    default: op
